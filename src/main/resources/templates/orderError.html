<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Order Rejected</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f6f8;
            padding: 40px 20px;
            color: #22262b;
        }

        .box {
            max-width: 720px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
        }

        h1 {
            margin-top: 0;
            font-size: 22px;
        }

        pre {
            background: #fff0f0;
            border-radius: 4px;
            padding: 12px;
            white-space: pre;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }

        pre.sent {
            background: #f5f6f8;
        }

        a {
            color: #22262b;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Order rejected</h1>
        <pre th:text="${orderError}"></pre>
        <div th:if="${requestJson != null and !requestJson.isEmpty()}">
            <p><strong>Request sent:</strong></p>
            <pre class="sent" th:text="${requestJson}"></pre>
        </div>
        <a href="/flows">Back to flow test hub</a>
    </div>
</body>

</html>
